[package]
name = "fpanda_api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart", "macros"] }
base64 = "0.23.1"
chrono = "0.4.45"
csv = "1.4.0"
form_urlencoded = "1.2.2"
futures = "0.3.34"
hex = "0.4.3"
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal", "rust_decimal", "chrono"] }
num-bigint = "0.4"
num-integer = "0.1.47"
num-rational = "0.4.2"
num-traits = "0.2.19"
pbkdf2 = "0.13.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form"] }
rsa = { version = "0.9.10", features = ["sha2"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = "2.5.8"

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "cookies", "multipart", "rustls", "form"] }

# 依存 crate は開発時も最適化する（PBKDF2・RSA の計算でテストが遅くならないように）
[profile.dev.package."*"]
opt-level = 2
