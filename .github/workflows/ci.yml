name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Rust)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fpanda
          MYSQL_USER: fpanda
          MYSQL_PASSWORD: fpanda
          TZ: Asia/Tokyo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # マイグレーションはアプリと同じ（root ではない）ユーザーで適用する
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: fpanda
      DB_PASSWORD: fpanda
      DB_NAME: fpanda
      # 統合テストはテストごとに DB を作成するため root で接続する
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "3306"
      TEST_DB_USER: root
      TEST_DB_PASSWORD: root
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      # バージョンは api/rust-toolchain.toml で決める（cargo が自動で入れる）
      - name: Rust のツールチェーン
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: migrate up
        run: cargo run --locked --bin migrate up
      - name: migrate up（再実行で変更がないこと）
        run: cargo run --locked --bin migrate up 2>&1 | tee /tmp/migrate.log && grep -q "no pending migrations" /tmp/migrate.log
      - name: migrate status
        run: |
          cargo run --locked --bin migrate status | tee /tmp/status.log
          if grep -q "^pending" /tmp/status.log; then exit 1; fi
      - name: テスト（単体・DB を使う統合テスト）
        run: cargo test --locked

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: lint
        run: npm run lint
      - name: build（型チェックを含む）
        run: npm run build
      - name: 単体テスト（node:test）
        run: npm test

  e2e:
    name: E2E (Docker Compose + Playwright)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: Playwright のブラウザをインストール
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: E2E テスト（専用のスタックを起動して実行）
        run: scripts/e2e.sh
        env:
          KEEP: "1" # 失敗時にログを出すため、停止は後のステップで行う
      - name: logs
        if: failure()
        run: COMPOSE_PROJECT_NAME=fpanda-e2e docker compose logs
      - name: Playwright のレポートを保存
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
      - name: down
        if: always()
        run: COMPOSE_PROJECT_NAME=fpanda-e2e docker compose down -v
