name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイル:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  integration:
    name: Migrations & integration tests (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fpanda
          MYSQL_USER: fpanda
          MYSQL_PASSWORD: fpanda
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: fpanda
      DB_PASSWORD: fpanda
      DB_NAME: fpanda
      # 統合テストはテストごとに DB を作成するため root で接続する
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "3306"
      TEST_DB_USER: root
      TEST_DB_PASSWORD: root
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: migrate up
        run: go run ./cmd/migrate up
      - name: migrate up（再実行で変更がないこと）
        run: go run ./cmd/migrate up 2>&1 | tee /tmp/migrate.log && grep -q "no pending migrations" /tmp/migrate.log
      - name: migrate status
        run: |
          go run ./cmd/migrate status | tee /tmp/status.log
          if grep -q "^pending" /tmp/status.log; then exit 1; fi
      - name: 統合テスト（DB を使うテスト）
        run: go test -race ./...

  api-rs:
    name: API (Rust)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fpanda
          TZ: Asia/Tokyo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: fpanda
      # 統合テストはテストごとに DB を作成するため root で接続する
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "3306"
      TEST_DB_USER: root
      TEST_DB_PASSWORD: root
    defaults:
      run:
        working-directory: api-rs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api-rs
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: migrate up
        run: cargo run --locked --bin migrate up
      - name: migrate status
        run: |
          cargo run --locked --bin migrate status | tee /tmp/status.log
          if grep -q "^pending" /tmp/status.log; then exit 1; fi
      - name: テスト（単体・DB を使う統合テスト）
        run: cargo test --locked

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: lint
        run: npm run lint
      - name: build（型チェックを含む）
        run: npm run build
      - name: 単体テスト（node:test）
        run: npm test

  e2e:
    name: E2E (Docker Compose + Playwright)
    runs-on: ubuntu-latest
    needs: [api, integration, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: Playwright のブラウザをインストール
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: E2E テスト（専用のスタックを起動して実行）
        run: scripts/e2e.sh
        env:
          KEEP: "1" # 失敗時にログを出すため、停止は後のステップで行う
      - name: logs
        if: failure()
        run: COMPOSE_PROJECT_NAME=fpanda-e2e docker compose logs
      - name: Playwright のレポートを保存
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
      - name: down
        if: always()
        run: COMPOSE_PROJECT_NAME=fpanda-e2e docker compose down -v
